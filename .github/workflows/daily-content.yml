# Every day at 06:00 IST: adds 25 new words, today's 10 editorial words,
# translations into 10 more Indian languages, using the free Gemini API (Google AI Studio) and the
# free Datamuse API; validates everything and publishes to main. Free: GitHub
# Actions is free for public repos and the Gemini free tier has no charge.
#
# Setup (once): add repository secret GEMINI_API_KEY (from
# https://aistudio.google.com/apikey). Optional repository variable
# GEMINI_MODEL to force a model; otherwise the newest free Flash is used.
# Optional secret DATAMUSE_API_KEY (Datamuse needs a key from 1 Feb 2027;
# without one the synonym check is skipped, not the run).
name: Daily content
on:
  schedule:
    # Off-peak minutes: GitHub delays jobs that start on the hour. The
    # second run is a backup; each job skips itself if it already ran today.
    - cron: "17 22 * * *" # 03:47 IST
    - cron: "13 3 * * *" # 08:43 IST
  workflow_dispatch:
    inputs:
      count:
        description: Words to add
        default: "25"

permissions:
  contents: write

concurrency:
  group: words
  cancel-in-progress: false

jobs:
  add-words:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Keep copies of the published files
        run: |
          rm -f .commit-message
          cp words.json /tmp/words.json
          [ -f editorial.json ] && cp editorial.json /tmp/editorial.json || true
      - name: Editorial words
        continue-on-error: true
        timeout-minutes: 12
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DATAMUSE_API_KEY: ${{ secrets.DATAMUSE_API_KEY }}
        run: dart run editorial.dart
      - name: Words
        continue-on-error: true
        timeout-minutes: 12
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DATAMUSE_API_KEY: ${{ secrets.DATAMUSE_API_KEY }}
        run: |
          if [ -n "${{ inputs.count }}" ]; then
            dart run generate.dart "${{ inputs.count }}"
          else
            dart run generate.dart
          fi
      - name: Levels (Datamuse word frequency)
        continue-on-error: true
        run: dart run levels.dart
      - name: Cloze passage
        continue-on-error: true
        timeout-minutes: 14
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          [ -f passages.json ] && cp passages.json /tmp/passages.json || true
          dart run cloze.dart
      - name: Topic packs (idioms, OWS, phrasal verbs, spelling, confusables, roots, foreign, errors)
        continue-on-error: true
        timeout-minutes: 12
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          for p in idioms ows phrasal spelling confusables roots foreign errors; do
            [ -f "$p.json" ] && cp "$p.json" "/tmp/$p.json" || true
          done
          # Two topics a run (the second uses Flash-Lite quota if needed).
          dart run packs.dart
          dart run packs.dart --second || true
      - name: Translations (10 more languages)
        continue-on-error: true
        timeout-minutes: 12
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: dart run translate.dart 120
      - name: Validate against the published files
        run: |
          git diff --quiet words.json || dart run validate.dart words.json /tmp/words.json
          if [ -f editorial.json ]; then
            if [ -f /tmp/editorial.json ]; then
              git diff --quiet editorial.json || dart run validate.dart editorial.json /tmp/editorial.json
            else
              dart run validate.dart editorial.json
            fi
          fi
          for p in idioms ows phrasal spelling confusables roots foreign errors passages; do
            if [ -n "$(git status --porcelain -- "$p.json")" ]; then
              if [ -f "/tmp/$p.json" ]; then
                dart run validate.dart "$p.json" "/tmp/$p.json"
              else
                dart run validate.dart "$p.json"
              fi
            fi
          done
      - name: Publish
        run: |
          for f in words.json editorial.json idioms.json ows.json phrasal.json spelling.json confusables.json roots.json foreign.json errors.json passages.json archive CHANGELOG.md; do
            if [ -e "$f" ]; then git add -A "$f"; fi
          done
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -F .commit-message
          git push origin HEAD:main
