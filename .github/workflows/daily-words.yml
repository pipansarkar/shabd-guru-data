# Adds 25 new words every day at 06:00 IST using the free Gemini API
# (Google AI Studio), validates them and publishes to main. Free: GitHub
# Actions is free for public repos and the Gemini free tier has no charge.
#
# Setup (once): add repository secret GEMINI_API_KEY (from
# https://aistudio.google.com/apikey). Optional repository variable
# GEMINI_MODEL to force a model; otherwise the newest free Flash is used.
name: Daily words
on:
  schedule:
    - cron: "30 0 * * *" # 00:30 UTC = 06:00 IST
  workflow_dispatch:
    inputs:
      count:
        description: Words to add
        default: "25"

permissions:
  contents: write

concurrency:
  group: words
  cancel-in-progress: false

jobs:
  add-words:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          cp words.json /tmp/previous.json
          dart run generate.dart "${{ inputs.count || '25' }}"
      - name: Validate against the published list
        run: |
          if git diff --quiet words.json; then
            echo "No new words today."
          else
            dart run validate.dart words.json /tmp/previous.json
          fi
      - name: Publish
        run: |
          if git diff --quiet words.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add words.json CHANGELOG.md
          git commit -m "$(cat .commit-message)"
          git push origin HEAD:main
